      if (cparams.indexOf(" ") > 0) {

        return 16;

  async calibConvert(param, currentFuncValue, unit_name, sensorType) {

    let paramOffset;

    let maxSize;
    let ratio;

    paramVer = await this.calibVersion(param);
    funVer = await this.calibVersion(currentFuncValue);
    funScale = await this.calibScale(unit_name, sensorType);
    funOffset = await this.calibOffset(unit_name);
    paramScale = funScale;
    paramOffset = funOffset;
    if (funVer < 3) {
      if (funVer == 2) {
        words = this._yapi.imm_decodeWords(currentFuncValue);
        if (words[0] == 1366 && words[1] == 12500) {
          funScale = 1;
          funOffset = 0;

          funScale = words[1];
          funOffset = words[0];
        }

        if (funVer == 1) {
          if (currentFuncValue == "" || YAPIContext.imm_atoi(currentFuncValue) > 10) {
            funScale = 0;
          }
        }
      }
    }
    calibData.length = 0;
    calibType = 0;
    if (paramVer < 3) {
      if (paramVer == 2) {
        words = this._yapi.imm_decodeWords(param);
        if (words[0] == 1366 && words[1] == 12500) {
          paramScale = 1;
          paramOffset = 0;
        } else {
          paramScale = words[1];
          paramOffset = words[0];
        }
        if (words.length >= 3 && words[2] > 0) {
          maxSize = 3 + 2 * (words[2] % 10);
          if (maxSize > words.length) {
            maxSize = words.length;
          }

          if (param == "" || words[0] > 10) {

      let hubs = [];
      for (let i = 0; i < this._connectedHubs.length; i++) {
        let hub = this._connectedHubs[i];
        let rootUrl = hub.imm_getRootUrl();
        let hubDev = this.imm_getDevice(rootUrl);
        if (!hubDev) {
          if (this._logLevel >= 4) {
            this.imm_log("Skip updateDeviceList for hub " + rootUrl + ", not yet loaded");
          }
          continue;
        }
        if (hub.imm_getcurrentState() < 1) {
          if (this._logLevel >= 4) {
            this.imm_log("Skip updateDeviceList for hub " + hub.urlInfo.imm_getHost() + ", currently offline");
          }
          continue;
        }
        if (hub.devListExpires <= this.GetTickCount()) {
          hub._missing = {};
          hubs.push(hub);
        }
      }
      for (let serial in this._devs) {
        let rooturl = this._devs[serial].imm_getRootUrl();
        for (let i = 0; i < hubs.length; i++) {
          let huburl = hubs[i].imm_getRootUrl();

      for (let res of newDeviceCounts) {

                  this.imm_log("Exception in device change callback:", e);
                }
              }
              break;
            case "-":
              if (this._logLevel >= 3) {
                this.imm_log("Device " + evt.serial + " unplugged");
              }
              if (this._removalCallback) {
                try {
                  await this._removalCallback(evt.module);
                } catch (e) {
                  this.imm_log("Exception in device removal callback:", e);

  async updateDeviceList_process(hub, hubDev, whitePages, yellowPages) {
    let newDevices = 0;
    let refresh = {};
    let serial = null;
    for (let classname in yellowPages) {
      let obj_yprecs = yellowPages[classname];
      let ftype = this._fnByType[classname];
      if (ftype == void 0) {
        ftype = new YFunctionType(this, classname);
        this._fnByType[classname] = ftype;
      }
      for (let i = 0; i < obj_yprecs.length; i++) {
        let yprec = obj_yprecs[i];
        let hwid = yprec.hardwareId;
        let basetype = yprec.baseType;
        if (ftype.imm_reindexFunction(hwid, yprec["logicalName"], yprec["advertisedValue"], basetype)) {
          serial = hwid.substr(0, hwid.indexOf("."));
          refresh[serial] = true;
        }
      }
    }
    for (let i = 0; i < whitePages.length; i++) {
      let devinfo = whitePages[i];
      serial = devinfo.serialNumber;
      let devydx = devinfo.index;
      let rooturl = devinfo.networkUrl.slice(0, -3);
      if (rooturl.charAt(0) == "/")
        rooturl = hubDev.imm_getRootUrl() + rooturl.substr(1);
      let currdev = this._devs[serial];
      if (this._logLevel >= 5) {
        this.imm_log("Device " + serial + " present, currdev " + (currdev ? "" : "NOT ") + "set" + (hub.imm_isFirstArrivalCallback() ? ", firstArrival" : ""));
      }
      if (currdev && hub.imm_isFirstArrivalCallback()) {
        newDevices++;
        if (this._arrivalCallback) {
          let module = YModule.FindModuleInContext(this, serial + ".module");
          this._pendingCallbacks.push({ event: "+", serial, module });
        }
      }
      hub.serialByYdx[devydx] = serial;
      if (!currdev) {
        new YDevice(this, rooturl, devinfo, yellowPages);
        newDevices++;
        if (this._arrivalCallback) {
          let module = YModule.FindModuleInContext(this, serial + ".module");
          this._pendingCallbacks.push({ event: "+", serial, module });
        }
      } else if (currdev.imm_getLogicalName() != devinfo["logicalName"]) {
        await currdev.refresh();
        if (this._namechgCallback) {
          let module = YModule.FindModuleInContext(this, serial + ".module");
          this._pendingCallbacks.push({ event: "/", serial, module });
        }
      } else if (refresh[serial] || currdev.imm_getRootUrl() != rooturl || currdev.imm_getBeacon() != devinfo["beacon"]) {
        await currdev.refresh();
      }
      hub._missing[serial] = false;
    }
    if (this._arrivalCallback && hub.imm_isFirstArrivalCallback()) {
      hub.imm_setFirstArrivalCallback(false);
    }
    for (serial in hub._missing) {
      if (hub._missing[serial] && this._devs[serial]) {
        if (this._removalCallback) {
          let module = YModule.FindModuleInContext(this, serial + ".module");
          this._pendingCallbacks.push({ event: "-", serial, module });
        }
        this.imm_forgetDevice(this._devs[serial]);
      }
    }

              case NOTIFY_NETPKT_DEVLOGYDX:

              case NOTIFY_NETPKT_CONFCHGYDX:

              case NOTIFY_NETPKT_TIMEAVGYDX:

        let parts;
        if (notype == "@") {
          hub.notifPos = parseInt(ev.slice(5));
        } else {

            case NOTIFY_NETPKT_NAME:
              parts = ev.slice(5).split(",");
              if (parts.length > 2) {

            case NOTIFY_NETPKT_CHILD:

              if (parts[2] == "0") {
                let serial = parts[1];

        case PUBVAL_2RAWBYTES:
        case PUBVAL_3RAWBYTES:
        case PUBVAL_4RAWBYTES:
        case PUBVAL_5RAWBYTES:
        case PUBVAL_6RAWBYTES:

            let c = arr_funcval[int_ofs++];

        case PUBVAL_YOCTO_FLOAT_E3:

          numVal += arr_funcval[int_ofs++] << 16;
          numVal += arr_funcval[int_ofs++] << 24;

            while (endp > 0 && buffer[endp - 1] == "0") {

              buffer = buffer.substr(0, endp);

          v += arr_funcval[int_ofs++] << 8;
          v += arr_funcval[int_ofs++] << 16;

          }

          return "?";

      buffer = "";

        if (arr_funcval[len] == 0) {
          break;
        }

  checkRange(input1, inputDesc1, input2, inputDesc2, minValue, maxValue) {
    let value1 = parseInt(input1.value);
    let err = "";
    if (isNaN(value1))
      err = inputDesc1 + " should be an integer";
    if (value1 < minValue)
      err = inputDesc1 + " should be greater or equal to " + minValue;
    if (value1 > maxValue)
      err = inputDesc1 + " should be less or equal to " + maxValue;
    input1.title = err;
    input1.style.backgroundColor = err != "" ? _WelcomePanel.BadInputColor : "";
    if (err != "")
      return false;
    if (input2 == null)
      return true;
    if (inputDesc2 == null)
      inputDesc2 = "";
    let value2 = parseInt(input2.value);
    if (isNaN(value2))
      err = inputDesc2 + " should be an integer";
    if (value2 < minValue)
      err = inputDesc2 + " should be greater or equal to " + minValue;
    if (value2 > maxValue)
      err = inputDesc2 + " should be less or equal to " + maxValue;
    if (err == "") {
      if (value1 > value2) {
        err = inputDesc2 + " should be greater or equal to " + inputDesc1;
        input1.title = err;
        input1.style.backgroundColor = _WelcomePanel.BadInputColor;
        input2.title = err;
        input2.style.backgroundColor = _WelcomePanel.BadInputColor;
        return false;
      } else {
        input1.title = "";
        input1.style.backgroundColor = "";
        input2.title = "";
        input2.style.backgroundColor = "";
        return true;
      }
    }
    input2.title = err;
    input2.style.backgroundColor = _WelcomePanel.BadInputColor;
    return false;
  }

  async refreshYfsFontList() {
    for (let i = 0; i < this.yFileFonts.length; i++)
      this.yFileFonts[i].flagged = false;
    let fs = YFiles.FirstFiles();
    while (fs != null) {
      let list = await fs.get_list("*.yfm");
      let serial = await fs.get_serialNumber();
      let friendly = await fs.get_friendlyName();
      for (let i = 0; i < list.length; i++) {
        let size = list[i].get_size();
        let filename = list[i].get_name();
        let foundIndex = -1;
        for (let j = 0; j < this.yFileFonts.length; j++ && foundIndex < 0)
          if (this.yFileFonts[j].isSameSame(serial, filename)) {
            foundIndex = j;
            this.yFileFonts[j].flagged = true;
          }
        if (foundIndex < 0) {
          let f = new YFileFont(fs, serial, friendly, filename, size, () => {
            this.sanityCheck();
          });
          f.flagged = true;
          this.yfileFileList.appendChild(f.htmlElement);
          this.yFileFonts.push(f);
        }
      }
      fs = fs.nextFiles();
    }
    for (let i = 0; i < this.yFileFonts.length; i++)
      this.yFileFonts[i].enabled = this.yFileFonts[i].flagged;
    if (this.yFileFonts.length > 0) {
      this.fontListHeader.innerText = "Here is the list of fonts files found on various filesystems, choose the one you want to load";
      this.yfileFileListContainer.style.display = "";
    } else {
      this.fontListHeader.innerHTML = _WelcomePanel.noYfmFileMsg;
      this.yfileFileListContainer.style.display = "None";
    }
    this.sanityCheck();

  checkTtFontValue() {
    if (this.ttfFontSize == null)
      return false;
    if (this.ttfFirstChar == null)
      return false;
    if (this.ttfLastChar == null)
      return false;
    if (this.ttfOutlineWidth == null)
      return false;
    if (this.ttfFillAndStroke == null)
      return false;
    let ok = true;
    this.ttfOutlineWidth.disabled = parseInt(this.ttfFillAndStroke.value) == 1;
    ok = ok && this.checkRange(this.ttfFirstChar, "first char", this.ttfLastChar, "last char", 0, 255);
    ok = ok && this.checkRange(this.ttfFontSize, "Font size", null, null, 1, 255);
    if (!ok)
      return false;
    if (this.ttfDemoOngoingRefresh != null)
      clearTimeout(this.ttfDemoOngoingRefresh);
    if (!this.ttfDemoOngoingRefreshRunning)
      this.ttfDemoOngoingRefresh = setTimeout(() => {
        this.refreshTtfFontDemo();
      }, 250);
    else
      this.ttfDemoOngoingRefreshMustRunAgain = true;
    return true;
  }
  refreshCompled() {
    this.ttfDemoOngoingRefreshRunning = false;
    if (this.ttfDemoOngoingRefreshMustRunAgain)
      this.ttfDemoOngoingRefresh = setTimeout(() => {
        this.refreshTtfFontDemo();
      }, 100);
    return 0;
  }
  refreshTtfFontDemo() {
    let sanityCheckIsRequired = false;
    this.ttfDemoOngoingRefreshRunning = true;
    if (this.ttfFontSize == null)
      return this.refreshCompled();
    if (this.ttfFontSample == null)
      return this.refreshCompled();
    if (this.ttfFontAntiAliasControl == null)
      return this.refreshCompled();
    if (this.ttfFontDemo == null)
      return this.refreshCompled();
    if (this.ttfFontDemoCtx == null)
      return this.refreshCompled();
    if (this.ttfOutlineWidth == null)
      return this.refreshCompled();
    if (this.ttfFillAndStroke == null)
      return this.refreshCompled();
    if (this.ttfDemoInternalcanvas == null) {
      this.ttfDemoInternalcanvas = document.createElement("canvas");
      this.ttfDemoInternalcanvas.style.border = "1px solid #d0d0d0";
      this.ttfDemoInternalcanvasCtx = this.ttfDemoInternalcanvas.getContext("2d", { willReadFrequently: true });
      if (this.ttfDemoInternalcanvasCtx == null)
        throw new RangeError("Unable to get Canvas context");
      sanityCheckIsRequired = this.ImportFont.checked;
    }
    if (this.ttfDemoInternalcanvasCtx == null)
      return;
    let selectedFont = this.selectedTtfFont();
    if (selectedFont == null)
      return this.refreshCompled();
    let sampletext = this.ttfFontSample.value;
    if (sampletext == "")
      sampletext = "demo";
    let size = parseInt(this.ttfFontSize.value);
    if (isNaN(size))
      return this.refreshCompled();
    if (size < 1)
      return this.refreshCompled();
    if (size > 255)
      return this.refreshCompled();
    let stokeWidth = 0;
    let fillStroke = parseInt(this.ttfFillAndStroke.value);
    if (parseInt(this.ttfFillAndStroke.value) > 1)
      stokeWidth = parseInt(this.ttfOutlineWidth.value) / 10;
    this.ttfDemoInternalcanvasCtx.font = size + "px " + selectedFont.fontName;
    this.ttfDemoInternalcanvasCtx.fillStyle = "black";
    this.ttfDemoInternalcanvasCtx.strokeStyle = "black";
    let textsize = this.ttfDemoInternalcanvasCtx.measureText(sampletext);
    let height = Math.ceil(Math.abs(textsize.actualBoundingBoxAscent) + Math.abs(textsize.actualBoundingBoxDescent));
    let width = Math.ceil(textsize.width);
    this.ttfDemoInternalcanvas.width = width;
    this.ttfDemoInternalcanvas.height = height;
    this.ttfDemoInternalcanvasCtx.textBaseline = "top";
    this.ttfDemoInternalcanvasCtx.font = size + "px " + selectedFont.fontName;
    this.ttfDemoInternalcanvasCtx.lineWidth = stokeWidth;
    if (fillStroke & 1)
      this.ttfDemoInternalcanvasCtx.fillText(sampletext, 0, 1);
    if (fillStroke & 2)
      this.ttfDemoInternalcanvasCtx.strokeText(sampletext, 0, 1);
    let threshold = parseInt(this.ttfFontAntiAliasControl.value);
    let pixels = this.ttfDemoInternalcanvasCtx.getImageData(0, 0, width, height);
    let index = 3;
    for (let j = 0; j < pixels.height; j++)
      for (let j2 = 0; j2 < pixels.width; j2++) {
        pixels.data[index] = pixels.data[index] < threshold ? 0 : 255;
        index += 4;
      }
    this.ttfFontDemoCtx.clearRect(0, 0, this.ttfFontDemo.width, this.ttfFontDemo.height);
    this.ttfFontDemoCtx.putImageData(pixels, this.ttfFontDemo.width - pixels.width >> 1, this.ttfFontDemo.height - pixels.height >> 1);
    this.refreshCompled();
    if (sanityCheckIsRequired)
      this.sanityCheck();
  }

  ipAddrInputSanityCheck(input, b) {
    let value = input.value;
    let ok = true;
    if (value == "") {
      b.enabled = false;
      input.title = "Enter an IP address";
      input.style.backgroundColor = "";
      return;
    }
    let tokens = value.split(".");
    if (tokens.length != 4)
      ok = false;
    for (let i = 0; i < 4; i++) {
      let b2 = parseInt(tokens[i]);
      if (isNaN(b2))
        ok = false;
      else if (b2 < 0 || b2 > 255)
        ok = false;
    }
    if (ok) {
      b.enabled = true;
      input.title = "Enter an IP address";
      input.style.backgroundColor = "";
      return;
    }
    b.enabled = false;
    input.title = "Invalid IP address format";
    input.style.backgroundColor = _WelcomePanel.BadInputColor;
    return;
  }
